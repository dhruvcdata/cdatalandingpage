<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111128;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg2)" rx="12"/>
  <text x="600" y="48" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">DBT + Airflow at Scale: Production Architecture</text>
  <text x="600" y="74" text-anchor="middle" fill="#94a3b8" font-size="14">How high-growth fintechs orchestrate 500+ models without breaking</text>
  <line x1="100" y1="92" x2="1100" y2="92" stroke="#1e293b" stroke-width="1"/>

  <!-- Left: Before (Pain) -->
  <rect x="60" y="110" width="520" height="250" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" fill="#f87171" font-size="16" font-weight="700">BEFORE: Common Anti-Patterns</text>

  <rect x="90" y="160" width="460" height="36" rx="6" fill="#1c1917"/>
  <text x="100" y="183" fill="#f87171" font-size="12">1.</text>
  <text x="120" y="183" fill="#cbd5e1" font-size="12">Monolithic DAG — one Airflow DAG runs all 500 DBT models sequentially</text>

  <rect x="90" y="205" width="460" height="36" rx="6" fill="#1c1917"/>
  <text x="100" y="228" fill="#f87171" font-size="12">2.</text>
  <text x="120" y="228" fill="#cbd5e1" font-size="12">No test gates — bad data propagates to gold layer before anyone notices</text>

  <rect x="90" y="250" width="460" height="36" rx="6" fill="#1c1917"/>
  <text x="100" y="273" fill="#f87171" font-size="12">3.</text>
  <text x="120" y="273" fill="#cbd5e1" font-size="12">Full refreshes on everything — 4-hour runs when 20 min would suffice</text>

  <rect x="90" y="295" width="460" height="36" rx="6" fill="#1c1917"/>
  <text x="100" y="318" fill="#f87171" font-size="12">4.</text>
  <text x="120" y="318" fill="#cbd5e1" font-size="12">No warehouse isolation — BI queries fight with transformation jobs</text>

  <!-- Right: After (Solution) -->
  <rect x="620" y="110" width="520" height="250" rx="10" fill="#0f172a" stroke="#14532d" stroke-width="1.5"/>
  <text x="880" y="140" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="700">AFTER: Production-Grade Patterns</text>

  <rect x="650" y="160" width="460" height="36" rx="6" fill="#052e16"/>
  <text x="660" y="183" fill="#6ee7b7" font-size="12">1.</text>
  <text x="680" y="183" fill="#cbd5e1" font-size="12">Domain-scoped DAGs — payments, credit, growth run independently</text>

  <rect x="650" y="205" width="460" height="36" rx="6" fill="#052e16"/>
  <text x="660" y="228" fill="#6ee7b7" font-size="12">2.</text>
  <text x="680" y="228" fill="#cbd5e1" font-size="12">Test gates between layers — bronze→silver blocked if tests fail</text>

  <rect x="650" y="250" width="460" height="36" rx="6" fill="#052e16"/>
  <text x="660" y="273" fill="#6ee7b7" font-size="12">3.</text>
  <text x="680" y="273" fill="#cbd5e1" font-size="12">Incremental models with merge strategy — 20 min instead of 4 hrs</text>

  <rect x="650" y="295" width="460" height="36" rx="6" fill="#052e16"/>
  <text x="660" y="318" fill="#6ee7b7" font-size="12">4.</text>
  <text x="680" y="318" fill="#cbd5e1" font-size="12">Dedicated warehouses — transform, serve, and explore isolated</text>

  <!-- Arrow -->
  <text x="600" y="240" text-anchor="middle" fill="#fbbf24" font-size="28">→</text>

  <!-- Middle: Architecture Diagram -->
  <rect x="60" y="385" width="1080" height="200" rx="10" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="600" y="415" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">RECOMMENDED ARCHITECTURE</text>

  <!-- Airflow -->
  <rect x="90" y="435" width="180" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="458" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">Airflow (MWAA)</text>
  <text x="180" y="476" text-anchor="middle" fill="#94a3b8" font-size="10">Orchestration + scheduling</text>

  <!-- Arrow -->
  <line x1="270" y1="462" x2="310" y2="462" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="310,458 310,466 318,462" fill="#f59e0b"/>

  <!-- DBT Domain DAGs -->
  <rect x="320" y="430" width="240" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="452" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">DBT Project</text>
  <rect x="335" y="460" width="65" height="24" rx="4" fill="#172554"/><text x="367" y="476" text-anchor="middle" fill="#93c5fd" font-size="9">payments</text>
  <rect x="407" y="460" width="55" height="24" rx="4" fill="#172554"/><text x="434" y="476" text-anchor="middle" fill="#93c5fd" font-size="9">credit</text>
  <rect x="469" y="460" width="60" height="24" rx="4" fill="#172554"/><text x="499" y="476" text-anchor="middle" fill="#93c5fd" font-size="9">growth</text>

  <!-- Arrow -->
  <line x1="560" y1="462" x2="600" y2="462" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="600,458 600,466 608,462" fill="#3b82f6"/>

  <!-- Test Gates -->
  <rect x="610" y="435" width="130" height="55" rx="8" fill="#052e16" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="675" y="458" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Test Gates</text>
  <text x="675" y="476" text-anchor="middle" fill="#94a3b8" font-size="10">dbt test + custom</text>

  <!-- Arrow -->
  <line x1="740" y1="462" x2="780" y2="462" stroke="#6ee7b7" stroke-width="1.5"/>
  <polygon points="780,458 780,466 788,462" fill="#6ee7b7"/>

  <!-- Warehouse -->
  <rect x="790" y="430" width="230" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="905" y="452" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Warehouse Layer</text>
  <rect x="805" y="460" width="65" height="24" rx="4" fill="#2e1065"/><text x="837" y="476" text-anchor="middle" fill="#c4b5fd" font-size="9">transform</text>
  <rect x="877" y="460" width="55" height="24" rx="4" fill="#2e1065"/><text x="904" y="476" text-anchor="middle" fill="#c4b5fd" font-size="9">serve</text>
  <rect x="939" y="460" width="60" height="24" rx="4" fill="#2e1065"/><text x="969" y="476" text-anchor="middle" fill="#c4b5fd" font-size="9">explore</text>

  <!-- Monitoring bar -->
  <rect x="90" y="520" width="930" height="40" rx="6" fill="#1e293b"/>
  <text x="555" y="545" text-anchor="middle" fill="#94a3b8" font-size="12">Datadog monitoring | Slack alerts on failures | Auto-retry with backoff | Cost attribution per domain</text>

  <!-- Bottom: Results -->
  <rect x="60" y="600" width="350" height="60" rx="10" fill="#052e16" stroke="#14532d" stroke-width="1"/>
  <text x="235" y="625" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">Pipeline runtime: 4hrs → 20min</text>
  <text x="235" y="645" text-anchor="middle" fill="#94a3b8" font-size="11">85% reduction with incremental models</text>

  <rect x="425" y="600" width="350" height="60" rx="10" fill="#172554" stroke="#1e3a5f" stroke-width="1"/>
  <text x="600" y="625" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Warehouse cost: -40%</text>
  <text x="600" y="645" text-anchor="middle" fill="#94a3b8" font-size="11">Dedicated warehouses with auto-suspend</text>

  <rect x="790" y="600" width="350" height="60" rx="10" fill="#1c1917" stroke="#78350f" stroke-width="1"/>
  <text x="965" y="625" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">Data quality incidents: -70%</text>
  <text x="965" y="645" text-anchor="middle" fill="#94a3b8" font-size="11">Test gates catch issues before gold layer</text>
</svg>
