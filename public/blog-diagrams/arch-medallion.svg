<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="url(#bg12)" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Medallion Architecture: Bronze / Silver / Gold</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Layered data organization in Snowflake</text>

  <!-- Source systems -->
  <rect x="30" y="130" width="130" height="200" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="160" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Sources</text>
  <rect x="45" y="175" width="100" height="28" rx="5" fill="#334155"/>
  <text x="95" y="194" text-anchor="middle" fill="#cbd5e1" font-size="11">CRM</text>
  <rect x="45" y="210" width="100" height="28" rx="5" fill="#334155"/>
  <text x="95" y="229" text-anchor="middle" fill="#cbd5e1" font-size="11">ERP</text>
  <rect x="45" y="245" width="100" height="28" rx="5" fill="#334155"/>
  <text x="95" y="264" text-anchor="middle" fill="#cbd5e1" font-size="11">APIs</text>
  <rect x="45" y="280" width="100" height="28" rx="5" fill="#334155"/>
  <text x="95" y="299" text-anchor="middle" fill="#cbd5e1" font-size="11">Streaming</text>

  <!-- Arrow -->
  <line x1="165" y1="230" x2="205" y2="230" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Bronze -->
  <rect x="210" y="100" width="190" height="260" rx="12" fill="#1e293b" stroke="#d97706" stroke-width="2"/>
  <rect x="210" y="100" width="190" height="45" rx="12" fill="#78350f" opacity="0.6"/>
  <rect x="210" y="130" width="190" height="15" fill="#78350f" opacity="0.6"/>
  <text x="305" y="130" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">BRONZE</text>
  <text x="305" y="170" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">RAW_DB</text>
  <rect x="225" y="185" width="160" height="25" rx="5" fill="#78350f" opacity="0.3"/>
  <text x="305" y="203" text-anchor="middle" fill="#94a3b8" font-size="11">Exact source copies</text>
  <rect x="225" y="218" width="160" height="25" rx="5" fill="#78350f" opacity="0.3"/>
  <text x="305" y="236" text-anchor="middle" fill="#94a3b8" font-size="11">Load timestamp</text>
  <rect x="225" y="251" width="160" height="25" rx="5" fill="#78350f" opacity="0.3"/>
  <text x="305" y="269" text-anchor="middle" fill="#94a3b8" font-size="11">Source system ID</text>
  <rect x="225" y="284" width="160" height="25" rx="5" fill="#78350f" opacity="0.3"/>
  <text x="305" y="302" text-anchor="middle" fill="#94a3b8" font-size="11">No transformations</text>
  <rect x="225" y="320" width="160" height="25" rx="5" fill="#0f172a"/>
  <text x="305" y="338" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Audit trail</text>

  <!-- Arrow -->
  <line x1="405" y1="230" x2="440" y2="230" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Silver -->
  <rect x="445" y="100" width="190" height="260" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="445" y="100" width="190" height="45" rx="12" fill="#374151" opacity="0.6"/>
  <rect x="445" y="130" width="190" height="15" fill="#374151" opacity="0.6"/>
  <text x="540" y="130" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="700">SILVER</text>
  <text x="540" y="170" text-anchor="middle" fill="#d1d5db" font-size="13" font-weight="600">CLEANED_DB</text>
  <rect x="460" y="185" width="160" height="25" rx="5" fill="#374151" opacity="0.3"/>
  <text x="540" y="203" text-anchor="middle" fill="#94a3b8" font-size="11">Deduplicated</text>
  <rect x="460" y="218" width="160" height="25" rx="5" fill="#374151" opacity="0.3"/>
  <text x="540" y="236" text-anchor="middle" fill="#94a3b8" font-size="11">Validated &amp; typed</text>
  <rect x="460" y="251" width="160" height="25" rx="5" fill="#374151" opacity="0.3"/>
  <text x="540" y="269" text-anchor="middle" fill="#94a3b8" font-size="11">Business keys</text>
  <rect x="460" y="284" width="160" height="25" rx="5" fill="#374151" opacity="0.3"/>
  <text x="540" y="302" text-anchor="middle" fill="#94a3b8" font-size="11">Referential integrity</text>
  <rect x="460" y="320" width="160" height="25" rx="5" fill="#0f172a"/>
  <text x="540" y="338" text-anchor="middle" fill="#d1d5db" font-size="11" font-weight="600">Single source of truth</text>

  <!-- Arrow -->
  <line x1="640" y1="230" x2="675" y2="230" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Gold -->
  <rect x="680" y="100" width="190" height="260" rx="12" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <rect x="680" y="100" width="190" height="45" rx="12" fill="#713f12" opacity="0.6"/>
  <rect x="680" y="130" width="190" height="15" fill="#713f12" opacity="0.6"/>
  <text x="775" y="130" text-anchor="middle" fill="#facc15" font-size="16" font-weight="700">GOLD</text>
  <text x="775" y="170" text-anchor="middle" fill="#fde047" font-size="13" font-weight="600">ANALYTICS_DB</text>
  <rect x="695" y="185" width="160" height="25" rx="5" fill="#713f12" opacity="0.3"/>
  <text x="775" y="203" text-anchor="middle" fill="#94a3b8" font-size="11">Dimensional models</text>
  <rect x="695" y="218" width="160" height="25" rx="5" fill="#713f12" opacity="0.3"/>
  <text x="775" y="236" text-anchor="middle" fill="#94a3b8" font-size="11">ML feature stores</text>
  <rect x="695" y="251" width="160" height="25" rx="5" fill="#713f12" opacity="0.3"/>
  <text x="775" y="269" text-anchor="middle" fill="#94a3b8" font-size="11">Aggregated tables</text>
  <rect x="695" y="284" width="160" height="25" rx="5" fill="#713f12" opacity="0.3"/>
  <text x="775" y="302" text-anchor="middle" fill="#94a3b8" font-size="11">Executive dashboards</text>
  <rect x="695" y="320" width="160" height="25" rx="5" fill="#0f172a"/>
  <text x="775" y="338" text-anchor="middle" fill="#facc15" font-size="11" font-weight="600">Business-ready</text>

  <!-- Bottom note -->
  <rect x="210" y="390" width="660" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="540" y="415" text-anchor="middle" fill="#94a3b8" font-size="12">Separate databases per layer for clean access control boundaries and permission management</text>
</svg>
