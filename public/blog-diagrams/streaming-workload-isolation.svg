<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)" rx="16"/>
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Streaming Workload Isolation on Snowflake</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Separate virtual warehouses prevent dashboard queries from competing with ML feature pipelines</text>

  <text x="120" y="100" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">Data Sources</text>
  <rect x="40" y="115" width="160" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="138" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Playback Events</text>
  <text x="120" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">Kafka → Snowpipe Streaming</text>

  <rect x="40" y="180" width="160" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="203" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Content Catalog</text>
  <text x="120" y="220" text-anchor="middle" fill="#94a3b8" font-size="10">CDC from MySQL · hourly</text>

  <rect x="40" y="245" width="160" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="268" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Billing &amp; Subscriptions</text>
  <text x="120" y="285" text-anchor="middle" fill="#94a3b8" font-size="10">Stripe webhooks → S3 → Snowpipe</text>

  <rect x="40" y="310" width="160" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="333" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Ad Impressions</text>
  <text x="120" y="350" text-anchor="middle" fill="#94a3b8" font-size="10">Partner feeds · S3 + COPY</text>

  <line x1="200" y1="140" x2="295" y2="160" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="205" x2="295" y2="160" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="270" x2="295" y2="160" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="335" x2="295" y2="160" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="295" y="90" width="310" height="370" rx="14" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="115" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">Snowflake Account</text>

  <rect x="315" y="135" width="270" height="55" rx="8" fill="#14532d" opacity="0.45" stroke="#22c55e" stroke-width="1"/>
  <text x="330" y="158" fill="#86efac" font-size="12" font-weight="700">ETL_WH</text>
  <text x="330" y="175" fill="#cbd5e1" font-size="11">Medium · auto-suspend 60s · scheduled DAGs</text>

  <rect x="315" y="200" width="270" height="55" rx="8" fill="#14532d" opacity="0.45" stroke="#22c55e" stroke-width="1"/>
  <text x="330" y="223" fill="#86efac" font-size="12" font-weight="700">BI_WH</text>
  <text x="330" y="240" fill="#cbd5e1" font-size="11">Large · multi-cluster · Looker + ad-hoc</text>

  <rect x="315" y="265" width="270" height="55" rx="8" fill="#14532d" opacity="0.45" stroke="#22c55e" stroke-width="1"/>
  <text x="330" y="288" fill="#86efac" font-size="12" font-weight="700">ML_FEATURE_WH</text>
  <text x="330" y="305" fill="#cbd5e1" font-size="11">XL · feature backfills · recs &amp; churn models</text>

  <rect x="315" y="330" width="270" height="55" rx="8" fill="#14532d" opacity="0.45" stroke="#22c55e" stroke-width="1"/>
  <text x="330" y="353" fill="#86efac" font-size="12" font-weight="700">ADHOC_WH</text>
  <text x="330" y="370" fill="#cbd5e1" font-size="11">Small · analysts &amp; product · auto-suspend 30s</text>

  <rect x="315" y="395" width="270" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="450" y="418" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">Centralized Storage · Time Travel · Zero-Copy Clones</text>
  <text x="450" y="434" text-anchor="middle" fill="#94a3b8" font-size="10">All warehouses query the same data — no copies</text>

  <line x1="605" y1="160" x2="700" y2="155" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="225" x2="700" y2="220" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="290" x2="700" y2="285" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="355" x2="700" y2="350" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="780" y="100" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">Consumers</text>

  <rect x="700" y="135" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="780" y="158" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">dbt + Airflow</text>
  <text x="780" y="174" text-anchor="middle" fill="#94a3b8" font-size="10">model materializations</text>

  <rect x="700" y="200" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="780" y="223" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">Looker</text>
  <text x="780" y="239" text-anchor="middle" fill="#94a3b8" font-size="10">2,000+ daily users</text>

  <rect x="700" y="265" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="780" y="288" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">ML Pipelines</text>
  <text x="780" y="304" text-anchor="middle" fill="#94a3b8" font-size="10">recommender · churn · fraud</text>

  <rect x="700" y="330" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="780" y="353" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">Hex / Mode</text>
  <text x="780" y="369" text-anchor="middle" fill="#94a3b8" font-size="10">analyst notebooks</text>

  <text x="450" y="490" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Each workload sized independently · spend isolated by warehouse · no noisy-neighbor</text>
</svg>
