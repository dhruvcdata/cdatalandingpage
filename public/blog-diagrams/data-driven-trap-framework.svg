    <polyline points="-136,-1 -131,5 -123,-5" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <text x="-10" y="-2" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Complete</text>
    <text x="-10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14b8a6" text-anchor="middle" opacity="0.7">(What Works)</text>
  </g>

  <!-- Right items -->
  <!-- Item 1 -->
  <g transform="translate(455, 155)">
    <rect x="0" y="0" width="290" height="60" rx="8" fill="#0a1a18" stroke="#134e4a" stroke-width="1" opacity="0.8"/>
    <circle cx="25" cy="30" r="14" fill="#042f2e" opacity="0.6"/>
    <rect x="17" y="23" width="7" height="14" rx="1" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.5"/>
