  <!-- Column background -->
  <rect x="430" y="70" width="340" height="410" rx="12" fill="url(#greenColBg)" stroke="#134e4a" stroke-width="0.8" opacity="0.6"/>

  <!-- Column header -->
  <g transform="translate(600, 98)">
    <!-- Check icon -->
