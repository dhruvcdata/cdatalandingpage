    <text x="52" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4a9e8e" opacity="0.8">Full picture across channels</text>
  </g>

  <!-- Item 2 -->
  <g transform="translate(455, 230)">
    <rect x="0" y="0" width="290" height="60" rx="8" fill="#0a1a18" stroke="#134e4a" stroke-width="1" opacity="0.8"/>
    <circle cx="25" cy="30" r="14" fill="#042f2e" opacity="0.6"/>
    <circle cx="21" cy="28" r="5" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.5"/>
    <circle cx="29" cy="28" r="5" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.4"/>
    <text x="52" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5eead4">New + existing customer insights</text>
    <text x="52" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4a9e8e" opacity="0.8">Acquisition and retention balance</text>
  </g>

  <!-- Item 3 -->
  <g transform="translate(455, 305)">
    <rect x="0" y="0" width="290" height="60" rx="8" fill="#0a1a18" stroke="#134e4a" stroke-width="1" opacity="0.8"/>
    <circle cx="25" cy="30" r="14" fill="#042f2e" opacity="0.6"/>
    <circle cx="25" cy="30" r="8" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.5"/>
    <path d="M25,22 L25,30 L31,30" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    <text x="52" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5eead4">Brand health + revenue metrics</text>
    <text x="52" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4a9e8e" opacity="0.8">Long-term and short-term together</text>
  </g>

  <!-- Item 4 -->
  <g transform="translate(455, 380)">
    <rect x="0" y="0" width="290" height="60" rx="8" fill="#0a1a18" stroke="#134e4a" stroke-width="1" opacity="0.8"/>
    <circle cx="25" cy="30" r="14" fill="#042f2e" opacity="0.6"/>
    <rect x="17" y="23" width="16" height="14" rx="2" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.5"/>
    <polyline points="20,30 23,33 30,26" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    <text x="52" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5eead4">Qualitative + quantitative data</text>
    <text x="52" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4a9e8e" opacity="0.8">Numbers informed by context</text>
  </g>

  <!-- Connecting arrows between left and right items -->
  <g opacity="0.25">
    <line x1="350" y1="185" x2="450" y2="185" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="448,182 455,185 448,188" fill="#64748b"/>

    <line x1="350" y1="260" x2="450" y2="260" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="448,257 455,260 448,263" fill="#64748b"/>

    <line x1="350" y1="335" x2="450" y2="335" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="448,332 455,335 448,338" fill="#64748b"/>

    <line x1="350" y1="410" x2="450" y2="410" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="448,407 455,410 448,413" fill="#64748b"/>
  </g>
</svg>