<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="450" fill="url(#bg3)" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">90-Day Cost Optimization Results</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Leading North American commercial real estate firm</text>

  <!-- Metric cards -->
  <!-- Card 1 -->
  <rect x="40" y="95" width="195" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="137" y="130" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">MONTHLY SPEND</text>
  <text x="137" y="170" text-anchor="middle" fill="#22c55e" font-size="36" font-weight="800">-52%</text>
  <text x="137" y="198" text-anchor="middle" fill="#94a3b8" font-size="12">reduction</text>

  <!-- Card 2 -->
  <rect x="252" y="95" width="195" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="349" y="130" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">QUERY PERFORMANCE</text>
  <text x="349" y="170" text-anchor="middle" fill="#22c55e" font-size="36" font-weight="800">+35%</text>
  <text x="349" y="198" text-anchor="middle" fill="#94a3b8" font-size="12">faster avg query time</text>

  <!-- Card 3 -->
  <rect x="464" y="95" width="195" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="561" y="130" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">COST ATTRIBUTION</text>
  <text x="561" y="170" text-anchor="middle" fill="#22c55e" font-size="36" font-weight="800">100%</text>
  <text x="561" y="198" text-anchor="middle" fill="#94a3b8" font-size="12">12 teams, 40+ pipelines</text>

  <!-- Card 4 -->
  <rect x="676" y="95" width="185" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="768" y="130" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">BUDGET OVERRUNS</text>
  <text x="768" y="170" text-anchor="middle" fill="#22c55e" font-size="36" font-weight="800">0</text>
  <text x="768" y="198" text-anchor="middle" fill="#94a3b8" font-size="12">after resource monitors</text>

  <!-- Bar chart -->
  <text x="80" y="260" fill="#94a3b8" font-size="12" font-weight="600">SAVINGS BY STRATEGY</text>
  <!-- Grid lines -->
  <line x1="280" y1="275" x2="280" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="3"/>
  <line x1="480" y1="275" x2="480" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="3"/>
  <line x1="680" y1="275" x2="680" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="3"/>
  <text x="280" y="438" text-anchor="middle" fill="#475569" font-size="11">20%</text>
  <text x="480" y="438" text-anchor="middle" fill="#475569" font-size="11">40%</text>
  <text x="680" y="438" text-anchor="middle" fill="#475569" font-size="11">60%</text>

  <!-- Bars -->
  <text x="78" y="297" fill="#cbd5e1" font-size="12" text-anchor="end">Right-sizing</text>
  <rect x="80" y="283" width="500" height="22" rx="4" fill="#3b82f6" opacity="0.8"/>
  <text x="590" y="299" fill="#fff" font-size="12" font-weight="700">25%</text>

  <text x="78" y="327" fill="#cbd5e1" font-size="12" text-anchor="end">Auto-suspend</text>
  <rect x="80" y="313" width="300" height="22" rx="4" fill="#6366f1" opacity="0.8"/>
  <text x="390" y="329" fill="#fff" font-size="12" font-weight="700">15%</text>

  <text x="78" y="357" fill="#cbd5e1" font-size="12" text-anchor="end">Query tuning</text>
  <rect x="80" y="343" width="160" height="22" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <text x="250" y="359" fill="#fff" font-size="12" font-weight="700">8%</text>

  <text x="78" y="387" fill="#cbd5e1" font-size="12" text-anchor="end">Zero-copy clones</text>
  <rect x="80" y="373" width="80" height="22" rx="4" fill="#a78bfa" opacity="0.8"/>
  <text x="170" y="389" fill="#fff" font-size="12" font-weight="700">4%</text>
</svg>
