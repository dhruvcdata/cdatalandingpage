  <!-- Data Sharing arrows (bidirectional between domains) -->
  <line x1="298" y1="270" x2="320" y2="270" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="580" y1="270" x2="602" y2="270" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4"/>

