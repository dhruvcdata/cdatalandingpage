<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0,0 6,0 3,8" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg5)" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Migration Architecture: Redshift → Snowflake</text>

  <!-- Source: Redshift -->
  <rect x="40" y="80" width="220" height="280" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="700">Amazon Redshift</text>
  <rect x="60" y="125" width="180" height="35" rx="6" fill="#7f1d1d" opacity="0.6"/>
  <text x="150" y="148" text-anchor="middle" fill="#fca5a5" font-size="12">Leader Node</text>
  <rect x="60" y="170" width="180" height="35" rx="6" fill="#7f1d1d" opacity="0.6"/>
  <text x="150" y="193" text-anchor="middle" fill="#fca5a5" font-size="12">Compute Nodes (cluster)</text>
  <rect x="60" y="215" width="180" height="35" rx="6" fill="#7f1d1d" opacity="0.6"/>
  <text x="150" y="238" text-anchor="middle" fill="#fca5a5" font-size="12">Managed Storage</text>
  <rect x="60" y="265" width="180" height="30" rx="6" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="150" y="285" text-anchor="middle" fill="#94a3b8" font-size="11">800+ tables | 2.3 TB</text>
  <rect x="60" y="305" width="180" height="30" rx="6" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="150" y="325" text-anchor="middle" fill="#94a3b8" font-size="11">Stored Procedures + UDFs</text>

  <!-- Middle: S3 Staging -->
  <line x1="265" y1="200" x2="340" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="302" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">UNLOAD</text>

  <rect x="340" y="130" width="220" height="160" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="160" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">Amazon S3</text>
  <text x="450" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">Staging Layer</text>
  <rect x="360" y="195" width="180" height="28" rx="6" fill="#78350f" opacity="0.4"/>
  <text x="450" y="214" text-anchor="middle" fill="#fcd34d" font-size="11">Compressed Parquet (Zstd)</text>
  <rect x="360" y="232" width="180" height="28" rx="6" fill="#78350f" opacity="0.4"/>
  <text x="450" y="251" text-anchor="middle" fill="#fcd34d" font-size="11">Partitioned by table</text>

  <!-- S3 to Snowflake -->
  <line x1="565" y1="200" x2="640" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="602" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">COPY INTO</text>

  <!-- Target: Snowflake -->
  <rect x="640" y="80" width="220" height="280" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="750" y="110" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="700">Snowflake</text>
  <rect x="660" y="125" width="180" height="35" rx="6" fill="#14532d" opacity="0.6"/>
  <text x="750" y="148" text-anchor="middle" fill="#86efac" font-size="12">Cloud Services</text>
  <rect x="660" y="170" width="180" height="35" rx="6" fill="#14532d" opacity="0.6"/>
  <text x="750" y="193" text-anchor="middle" fill="#86efac" font-size="12">Virtual Warehouses</text>
  <rect x="660" y="215" width="180" height="35" rx="6" fill="#14532d" opacity="0.6"/>
  <text x="750" y="238" text-anchor="middle" fill="#86efac" font-size="12">Centralized Storage</text>
  <rect x="660" y="265" width="180" height="30" rx="6" fill="#1e293b" stroke="#14532d" stroke-width="1"/>
  <text x="750" y="285" text-anchor="middle" fill="#94a3b8" font-size="11">Auto compression</text>
  <rect x="660" y="305" width="180" height="30" rx="6" fill="#1e293b" stroke="#14532d" stroke-width="1"/>
  <text x="750" y="325" text-anchor="middle" fill="#94a3b8" font-size="11">Per-second billing</text>

  <!-- Validation layer -->
  <rect x="250" y="380" width="400" height="70" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="405" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">Automated Validation Pipeline</text>
  <text x="450" y="430" text-anchor="middle" fill="#94a3b8" font-size="12">Row counts → Aggregates → Sample comparison → Query result matching</text>

  <line x1="150" y1="365" x2="150" y2="415" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>
  <line x1="150" y1="415" x2="245" y2="415" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>
  <line x1="750" y1="365" x2="750" y2="415" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>
  <line x1="750" y1="415" x2="655" y2="415" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/>
</svg>
