<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="900" height="680" fill="url(#bg)" rx="12"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Modern Data Lakehouse Architecture</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Apache Iceberg + Spark + AWS Glue</text>

  <!-- Data Sources -->
  <rect x="30" y="85" width="840" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="100" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1">DATA SOURCES</text>
  <rect x="120" y="108" width="90" height="24" rx="4" fill="#334155"/><text x="165" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">Databases</text>
  <rect x="230" y="108" width="90" height="24" rx="4" fill="#334155"/><text x="275" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">APIs</text>
  <rect x="340" y="108" width="90" height="24" rx="4" fill="#334155"/><text x="385" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">CDC Streams</text>
  <rect x="450" y="108" width="90" height="24" rx="4" fill="#334155"/><text x="495" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">Kafka</text>
  <rect x="560" y="108" width="90" height="24" rx="4" fill="#334155"/><text x="605" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">File Drops</text>
  <rect x="670" y="108" width="90" height="24" rx="4" fill="#334155"/><text x="715" y="124" text-anchor="middle" fill="#cbd5e1" font-size="10">SaaS APIs</text>

  <!-- Arrow down -->
  <line x1="450" y1="140" x2="450" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Raw Zone -->
  <rect x="130" y="170" width="640" height="70" rx="8" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="190" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="700" letter-spacing="1">RAW ZONE — S3</text>
  <text x="450" y="208" text-anchor="middle" fill="#94a3b8" font-size="10">Parquet / JSON / CSV — Immutable landing zone</text>
  <text x="450" y="225" text-anchor="middle" fill="#64748b" font-size="9">s3://lake/raw/{source}/{date}/</text>

  <!-- Arrow down -->
  <line x1="450" y1="240" x2="450" y2="265" stroke="#475569" stroke-width="2"/>

  <!-- Glue Catalog -->
  <rect x="230" y="270" width="440" height="65" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="290" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1">AWS GLUE DATA CATALOG</text>
  <text x="450" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">Centralized metadata — Schema discovery — Table registry</text>
  <rect x="260" y="315" width="70" height="14" rx="3" fill="#44403c"/><text x="295" y="325" text-anchor="middle" fill="#fbbf24" font-size="8">raw_db</text>
  <rect x="345" y="315" width="70" height="14" rx="3" fill="#44403c"/><text x="380" y="325" text-anchor="middle" fill="#fbbf24" font-size="8">curated_db</text>
  <rect x="430" y="315" width="70" height="14" rx="3" fill="#44403c"/><text x="465" y="325" text-anchor="middle" fill="#fbbf24" font-size="8">serving_db</text>
  <rect x="515" y="315" width="80" height="14" rx="3" fill="#44403c"/><text x="555" y="325" text-anchor="middle" fill="#fbbf24" font-size="8">Crawler</text>

  <!-- Arrow down -->
  <line x1="450" y1="335" x2="450" y2="360" stroke="#475569" stroke-width="2"/>

  <!-- Spark Compute -->
  <rect x="230" y="365" width="440" height="60" rx="8" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="385" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700" letter-spacing="1">SPARK ON KUBERNETES / AWS GLUE ETL</text>
  <text x="450" y="403" text-anchor="middle" fill="#94a3b8" font-size="10">Clean — Enrich — Aggregate — Validate — Write Iceberg</text>

  <!-- Arrow down -->
  <line x1="450" y1="425" x2="450" y2="450" stroke="#475569" stroke-width="2"/>

  <!-- Iceberg Curated Zone -->
  <rect x="130" y="455" width="640" height="80" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="475" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1">CURATED ZONE — APACHE ICEBERG ON S3</text>
  <text x="450" y="493" text-anchor="middle" fill="#94a3b8" font-size="10">ACID Transactions — Schema Evolution — Time Travel — Partition Evolution</text>
  <rect x="170" y="505" width="100" height="20" rx="4" fill="rgba(16,185,129,0.15)"/><text x="220" y="519" text-anchor="middle" fill="#34d399" font-size="9">Snapshots</text>
  <rect x="290" y="505" width="100" height="20" rx="4" fill="rgba(16,185,129,0.15)"/><text x="340" y="519" text-anchor="middle" fill="#34d399" font-size="9">Zstd Parquet</text>
  <rect x="410" y="505" width="100" height="20" rx="4" fill="rgba(16,185,129,0.15)"/><text x="460" y="519" text-anchor="middle" fill="#34d399" font-size="9">Compaction</text>
  <rect x="530" y="505" width="100" height="20" rx="4" fill="rgba(16,185,129,0.15)"/><text x="580" y="519" text-anchor="middle" fill="#34d399" font-size="9">Rollback</text>

  <!-- Arrow down to consumers -->
  <line x1="200" y1="535" x2="200" y2="570" stroke="#475569" stroke-width="1.5"/>
  <line x1="340" y1="535" x2="340" y2="570" stroke="#475569" stroke-width="1.5"/>
  <line x1="480" y1="535" x2="480" y2="570" stroke="#475569" stroke-width="1.5"/>
  <line x1="620" y1="535" x2="620" y2="570" stroke="#475569" stroke-width="1.5"/>

  <!-- Consumer boxes -->
  <rect x="140" y="575" width="120" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="200" y="595" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">Athena</text>
  <text x="200" y="610" text-anchor="middle" fill="#64748b" font-size="9">Ad-hoc SQL</text>

  <rect x="280" y="575" width="120" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="340" y="595" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">Trino / Spark</text>
  <text x="340" y="610" text-anchor="middle" fill="#64748b" font-size="9">ML Training</text>

  <rect x="420" y="575" width="120" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="480" y="595" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">Snowflake</text>
  <text x="480" y="610" text-anchor="middle" fill="#64748b" font-size="9">BI / Reporting</text>

  <rect x="560" y="575" width="120" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="620" y="595" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">dbt</text>
  <text x="620" y="610" text-anchor="middle" fill="#64748b" font-size="9">Transforms</text>

  <!-- Footer -->
  <text x="450" y="655" text-anchor="middle" fill="#475569" font-size="10">cdatainsights.com — CData Consulting Inc</text>
</svg>
