<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg10)" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Multi-Engine Interoperability with Apache Iceberg</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">One table, multiple engines — zero data copies</text>

  <!-- Query Engines (top) -->
  <rect x="50" y="90" width="160" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="700">Snowflake</text>
  <text x="130" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">BI + Ad-hoc Analysis</text>

  <rect x="240" y="90" width="160" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">Apache Spark</text>
  <text x="320" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">ETL + ML Features</text>

  <rect x="430" y="90" width="160" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="510" y="118" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="700">Trino</text>
  <text x="510" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">Federated Queries</text>

  <rect x="620" y="90" width="160" height="70" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="700" y="118" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">Apache Flink</text>
  <text x="700" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">Real-time Streaming</text>

  <!-- Arrows down -->
  <line x1="130" y1="165" x2="130" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="165" x2="320" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="165" x2="510" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="165" x2="700" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Iceberg Catalog Layer -->
  <rect x="50" y="215" width="730" height="60" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="415" y="240" text-anchor="middle" fill="#a78bfa" font-size="16" font-weight="700">Apache Iceberg Catalog</text>
  <text x="415" y="262" text-anchor="middle" fill="#94a3b8" font-size="12">Metadata management  |  Schema evolution  |  Partition tracking  |  Snapshot history</text>

  <!-- Arrow down -->
  <line x1="415" y1="280" x2="415" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Iceberg Table Format -->
  <rect x="150" y="320" width="530" height="55" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="415" y="345" text-anchor="middle" fill="#818cf8" font-size="16" font-weight="700">Iceberg Table Format</text>
  <text x="415" y="365" text-anchor="middle" fill="#94a3b8" font-size="12">ACID transactions  |  Time travel  |  Hidden partitioning</text>

  <!-- Arrow down -->
  <line x1="415" y1="380" x2="415" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Storage Layer -->
  <rect x="100" y="410" width="630" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="260" y="441" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Amazon S3 / Azure Blob / GCS</text>
  <text x="560" y="441" text-anchor="middle" fill="#94a3b8" font-size="13">Parquet Files (Open Format)</text>

  <!-- Side callout -->
  <rect x="810" y="215" width="70" height="200" rx="10" fill="#14532d" opacity="0.5" stroke="#22c55e" stroke-width="1"/>
  <text x="845" y="270" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="700" transform="rotate(90 845 310)">NO VENDOR LOCK-IN</text>
</svg>
