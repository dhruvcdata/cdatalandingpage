<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bgH)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Hybrid Pipeline Architecture</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Kafka backbone — Hot path (streaming) + Cold path (batch)</text>

  <!-- Event Sources -->
  <rect x="330" y="75" width="240" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="450" y="100" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Event Sources (Apps, Ads, IoT)</text>

  <!-- Arrow to Kafka -->
  <line x1="450" y1="115" x2="450" y2="140" stroke="#64748b" stroke-width="2"/>

  <!-- Kafka -->
  <rect x="250" y="145" width="400" height="55" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="168" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">APACHE KAFKA</text>
  <text x="450" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">Durable — Ordered — Replayable — Multi-consumer</text>

  <!-- Split arrows -->
  <line x1="350" y1="200" x2="220" y2="245" stroke="#f87171" stroke-width="2"/>
  <line x1="550" y1="200" x2="680" y2="245" stroke="#3b82f6" stroke-width="2"/>

  <!-- HOT PATH -->
  <rect x="50" y="250" width="340" height="200" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/>
  <text x="220" y="275" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700" letter-spacing="1">HOT PATH (Streaming)</text>

  <rect x="80" y="290" width="280" height="35" rx="5" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="220" y="312" text-anchor="middle" fill="#e5e7eb" font-size="10" font-weight="600">Spark Structured Streaming</text>

  <text x="220" y="345" text-anchor="middle" fill="#94a3b8" font-size="10">5-min windowed aggregations</text>
  <text x="220" y="360" text-anchor="middle" fill="#94a3b8" font-size="10">Running counts, sums, averages</text>

  <!-- Hot path output -->
  <rect x="90" y="380" width="120" height="45" rx="5" fill="rgba(248,113,113,0.1)" stroke="#f87171" stroke-width="1"/>
  <text x="150" y="400" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Redis</text>
  <text x="150" y="415" text-anchor="middle" fill="#64748b" font-size="8">Hot cache</text>

  <rect x="230" y="380" width="120" height="45" rx="5" fill="rgba(248,113,113,0.1)" stroke="#f87171" stroke-width="1"/>
  <text x="290" y="400" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">ClickHouse</text>
  <text x="290" y="415" text-anchor="middle" fill="#64748b" font-size="8">RT dashboards</text>

  <!-- COLD PATH -->
  <rect x="510" y="250" width="340" height="200" rx="10" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="680" y="275" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700" letter-spacing="1">COLD PATH (Batch)</text>

  <rect x="540" y="290" width="280" height="35" rx="5" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="680" y="312" text-anchor="middle" fill="#e5e7eb" font-size="10" font-weight="600">Kafka Connect → S3 → Spark Jobs</text>

  <text x="680" y="345" text-anchor="middle" fill="#94a3b8" font-size="10">Daily/hourly full re-computation</text>
  <text x="680" y="360" text-anchor="middle" fill="#94a3b8" font-size="10">Complex joins, reconciliation</text>

  <!-- Cold path output -->
  <rect x="550" y="380" width="120" height="45" rx="5" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="610" y="400" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Iceberg</text>
  <text x="610" y="415" text-anchor="middle" fill="#64748b" font-size="8">System of record</text>

  <rect x="690" y="380" width="120" height="45" rx="5" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="750" y="400" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Athena / BI</text>
  <text x="750" y="415" text-anchor="middle" fill="#64748b" font-size="8">Reports + ML</text>

  <!-- Comparison labels -->
  <rect x="100" y="480" width="280" height="55" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="1" stroke-opacity="0.3"/>
  <text x="240" y="500" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Latency: seconds</text>
  <text x="240" y="516" text-anchor="middle" fill="#64748b" font-size="9">Approximate — Last 24 hours</text>
  <text x="240" y="528" text-anchor="middle" fill="#64748b" font-size="9">Powers live campaign dashboards</text>

  <rect x="520" y="480" width="280" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="660" y="500" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Latency: hours</text>
  <text x="660" y="516" text-anchor="middle" fill="#64748b" font-size="9">Exact — Full history</text>
  <text x="660" y="528" text-anchor="middle" fill="#64748b" font-size="9">Powers billing + reports</text>

  <!-- VS label -->
  <rect x="410" y="490" width="80" height="30" rx="15" fill="#334155"/>
  <text x="450" y="510" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">SAME DATA</text>

  <!-- Footer -->
  <text x="450" y="575" text-anchor="middle" fill="#475569" font-size="10">cdatainsights.com — CData Consulting Inc</text>
</svg>
