<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="600" fill="#0a0a0a"/>

  <text x="600" y="60" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="600">The LEED Certification Data Pipeline</text>
  <text x="600" y="90" text-anchor="middle" font-size="15" fill="#9ca3af">From utility meter to LEED Online submission</text>

  <!-- Stage 1: Sources -->
  <rect x="60" y="160" width="190" height="240" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="155" y="190" text-anchor="middle" font-size="11" fill="#3b82f6" letter-spacing="2" font-weight="600">SOURCES</text>
  <line x1="90" y1="205" x2="220" y2="205" stroke="#262626"/>
  <text x="155" y="235" text-anchor="middle" font-size="14" fill="#e5e5e5">Utility bills</text>
  <text x="155" y="260" text-anchor="middle" font-size="14" fill="#e5e5e5">BMS / submeters</text>
  <text x="155" y="285" text-anchor="middle" font-size="14" fill="#e5e5e5">Water meters</text>
  <text x="155" y="310" text-anchor="middle" font-size="14" fill="#e5e5e5">Waste haulers</text>
  <text x="155" y="335" text-anchor="middle" font-size="14" fill="#e5e5e5">Tenant surveys</text>
  <text x="155" y="360" text-anchor="middle" font-size="14" fill="#e5e5e5">Procurement logs</text>

  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M 260 280 L 315 280" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 2: Normalize -->
  <rect x="325" y="160" width="200" height="240" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="425" y="190" text-anchor="middle" font-size="11" fill="#3b82f6" letter-spacing="2" font-weight="600">NORMALIZE</text>
  <line x1="355" y1="205" x2="495" y2="205" stroke="#262626"/>
  <text x="425" y="235" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="500">ENERGY STAR</text>
  <text x="425" y="255" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="500">Portfolio Manager</text>
  <text x="425" y="290" text-anchor="middle" font-size="13" fill="#9ca3af">Unit conversion</text>
  <text x="425" y="310" text-anchor="middle" font-size="13" fill="#9ca3af">Weather normalization</text>
  <text x="425" y="330" text-anchor="middle" font-size="13" fill="#9ca3af">Site / source EUI</text>
  <text x="425" y="350" text-anchor="middle" font-size="13" fill="#9ca3af">Property metadata</text>

  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M 535 280 L 590 280" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 3: Pipeline -->
  <rect x="600" y="160" width="200" height="240" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="700" y="190" text-anchor="middle" font-size="11" fill="#3b82f6" letter-spacing="2" font-weight="600">TRANSFORM</text>
  <line x1="630" y1="205" x2="770" y2="205" stroke="#262626"/>
  <text x="700" y="235" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="500">dbt models</text>
  <text x="700" y="270" text-anchor="middle" font-size="13" fill="#9ca3af">Credit calculations</text>
  <text x="700" y="290" text-anchor="middle" font-size="13" fill="#9ca3af">Baseline comparisons</text>
  <text x="700" y="310" text-anchor="middle" font-size="13" fill="#9ca3af">QA / outlier flags</text>
  <text x="700" y="330" text-anchor="middle" font-size="13" fill="#9ca3af">Audit trail</text>
  <text x="700" y="365" text-anchor="middle" font-size="12" fill="#737373">Snowflake · Postgres</text>

  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M 810 280 L 865 280" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 4: Submit -->
  <rect x="875" y="160" width="200" height="240" rx="12" fill="#3b82f6"/>
  <text x="975" y="190" text-anchor="middle" font-size="11" fill="#dbeafe" letter-spacing="2" font-weight="600">SUBMIT</text>
  <line x1="905" y1="205" x2="1045" y2="205" stroke="#60a5fa" opacity="0.5"/>
  <text x="975" y="240" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="600">LEED Online</text>
  <text x="975" y="265" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="600">Arc Skoru</text>
  <text x="975" y="300" text-anchor="middle" font-size="13" fill="#dbeafe">Credit forms</text>
  <text x="975" y="320" text-anchor="middle" font-size="13" fill="#dbeafe">Performance scores</text>
  <text x="975" y="340" text-anchor="middle" font-size="13" fill="#dbeafe">Documentation</text>
  <text x="975" y="375" text-anchor="middle" font-size="13" fill="#bfdbfe" font-weight="500">→ Certification</text>

  <!-- Bottom band: continuous monitoring -->
  <rect x="60" y="450" width="1015" height="80" rx="12" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="567" y="478" text-anchor="middle" font-size="11" fill="#3b82f6" letter-spacing="2" font-weight="600">CONTINUOUS MONITORING (LEED v4.1 + v5)</text>
  <text x="567" y="505" text-anchor="middle" font-size="14" fill="#e5e5e5">Re-certification every three years · Performance drift alerts · Tenant engagement metrics</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
