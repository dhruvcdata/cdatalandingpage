<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Georgia, 'Iowan Old Style', serif">
  <rect width="1200" height="600" fill="#F5F1EA"/>

  <text x="600" y="60" text-anchor="middle" font-size="32" fill="#1F1E1D" font-style="italic">The LEED Certification Data Pipeline</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#6B655D" font-family="system-ui, sans-serif">From utility meter to LEED Online submission</text>

  <!-- Stage 1: Sources -->
  <g>
    <rect x="60" y="170" width="180" height="220" rx="8" fill="#FFFFFF" stroke="#E8E2D5" stroke-width="1.5"/>
    <text x="150" y="200" text-anchor="middle" font-size="13" fill="#C15F3C" font-family="system-ui, sans-serif" letter-spacing="2">SOURCES</text>
    <line x1="90" y1="215" x2="210" y2="215" stroke="#E8E2D5"/>
    <text x="150" y="245" text-anchor="middle" font-size="14" fill="#1F1E1D">Utility bills</text>
    <text x="150" y="270" text-anchor="middle" font-size="14" fill="#1F1E1D">BMS / submeters</text>
    <text x="150" y="295" text-anchor="middle" font-size="14" fill="#1F1E1D">Water meters</text>
    <text x="150" y="320" text-anchor="middle" font-size="14" fill="#1F1E1D">Waste haulers</text>
    <text x="150" y="345" text-anchor="middle" font-size="14" fill="#1F1E1D">Tenant surveys</text>
    <text x="150" y="370" text-anchor="middle" font-size="14" fill="#1F1E1D">Procurement logs</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#C15F3C" stroke-width="2" fill="none">
    <path d="M 250 280 L 305 280" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 2: Normalize -->
  <g>
    <rect x="315" y="170" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#E8E2D5" stroke-width="1.5"/>
    <text x="415" y="200" text-anchor="middle" font-size="13" fill="#C15F3C" font-family="system-ui, sans-serif" letter-spacing="2">NORMALIZE</text>
    <line x1="345" y1="215" x2="485" y2="215" stroke="#E8E2D5"/>
    <text x="415" y="245" text-anchor="middle" font-size="14" fill="#1F1E1D" font-style="italic">ENERGY STAR</text>
    <text x="415" y="265" text-anchor="middle" font-size="14" fill="#1F1E1D" font-style="italic">Portfolio Manager</text>
    <text x="415" y="295" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Unit conversion</text>
    <text x="415" y="315" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Weather normalization</text>
    <text x="415" y="335" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Site / source EUI</text>
    <text x="415" y="355" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Property metadata</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="#C15F3C" stroke-width="2" fill="none">
    <path d="M 525 280 L 580 280" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 3: Pipeline -->
  <g>
    <rect x="590" y="170" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#E8E2D5" stroke-width="1.5"/>
    <text x="690" y="200" text-anchor="middle" font-size="13" fill="#C15F3C" font-family="system-ui, sans-serif" letter-spacing="2">TRANSFORM</text>
    <line x1="620" y1="215" x2="760" y2="215" stroke="#E8E2D5"/>
    <text x="690" y="245" text-anchor="middle" font-size="14" fill="#1F1E1D" font-style="italic">dbt models</text>
    <text x="690" y="275" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Credit calculations</text>
    <text x="690" y="295" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Baseline comparisons</text>
    <text x="690" y="315" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">QA / outlier flags</text>
    <text x="690" y="335" text-anchor="middle" font-size="13" fill="#6B655D" font-family="system-ui, sans-serif">Audit trail</text>
    <text x="690" y="365" text-anchor="middle" font-size="13" fill="#1F1E1D" font-family="system-ui, sans-serif">Snowflake · Postgres</text>
  </g>

  <!-- Arrow 3 -->
  <g stroke="#C15F3C" stroke-width="2" fill="none">
    <path d="M 800 280 L 855 280" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 4: Submit -->
  <g>
    <rect x="865" y="170" width="180" height="220" rx="8" fill="#C15F3C"/>
    <text x="955" y="200" text-anchor="middle" font-size="13" fill="#F5F1EA" font-family="system-ui, sans-serif" letter-spacing="2">SUBMIT</text>
    <line x1="895" y1="215" x2="1015" y2="215" stroke="#F5F1EA" opacity="0.4"/>
    <text x="955" y="250" text-anchor="middle" font-size="16" fill="#F5F1EA" font-style="italic">LEED Online</text>
    <text x="955" y="275" text-anchor="middle" font-size="16" fill="#F5F1EA" font-style="italic">Arc Skoru</text>
    <text x="955" y="305" text-anchor="middle" font-size="13" fill="#F5F1EA" font-family="system-ui, sans-serif" opacity="0.85">Credit forms</text>
    <text x="955" y="325" text-anchor="middle" font-size="13" fill="#F5F1EA" font-family="system-ui, sans-serif" opacity="0.85">Performance scores</text>
    <text x="955" y="345" text-anchor="middle" font-size="13" fill="#F5F1EA" font-family="system-ui, sans-serif" opacity="0.85">Documentation</text>
    <text x="955" y="375" text-anchor="middle" font-size="13" fill="#F5F1EA" font-family="system-ui, sans-serif" opacity="0.7">→ Certification</text>
  </g>

  <!-- Bottom band: continuous monitoring -->
  <rect x="60" y="450" width="985" height="80" rx="8" fill="#FAF7F2" stroke="#E8E2D5" stroke-width="1.5"/>
  <text x="552" y="478" text-anchor="middle" font-size="13" fill="#C15F3C" font-family="system-ui, sans-serif" letter-spacing="2">CONTINUOUS MONITORING (LEED v4.1 + v5)</text>
  <text x="552" y="505" text-anchor="middle" font-size="14" fill="#1F1E1D" font-style="italic">Re-certification every three years · Performance drift alerts · Tenant engagement metrics</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C15F3C"/>
    </marker>
  </defs>
</svg>
