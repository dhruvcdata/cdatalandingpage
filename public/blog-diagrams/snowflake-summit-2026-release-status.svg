<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="rsbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" fill="url(#rsbg)" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">What&#39;s Actually Production-Ready</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">Release stage as of June 2026 — confirm on Snowflake&#39;s Preview Features page before you build a roadmap on any item.</text>

  <!-- GA -->
  <rect x="40" y="90" width="266" height="340" rx="12" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="40" y="90" width="266" height="40" rx="12" fill="#14532d" opacity="0.5"/>
  <text x="173" y="116" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="800">GA — ship it</text>
  <g font-size="12.5" fill="#d1fae5" font-weight="600">
    <text x="62" y="162">CoCo Desktop</text>
    <text x="62" y="196">CoWork (personal agent)</text>
    <text x="62" y="230">Grok in Cortex AI</text>
    <text x="62" y="264">Iceberg managed storage</text>
    <text x="62" y="298">Salesforce zero-copy</text>
  </g>
  <text x="62" y="406" fill="#4ade80" font-size="11" font-style="italic">Safe for production today.</text>

  <!-- Public Preview -->
  <rect x="317" y="90" width="266" height="340" rx="12" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="317" y="90" width="266" height="40" rx="12" fill="#1e3a8a" opacity="0.5"/>
  <text x="450" y="116" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="800">Public Preview — pilot</text>
  <g font-size="12.5" fill="#dbeafe" font-weight="600">
    <text x="339" y="162">Cortex AI Function Studio</text>
    <text x="339" y="196">App Runtime + CoCo apps</text>
    <text x="339" y="230">Custom AI Functions</text>
    <text x="339" y="264">Cost Control for AI</text>
    <text x="339" y="298">Multi-Party Collaboration</text>
  </g>
  <text x="339" y="406" fill="#93c5fd" font-size="11" font-style="italic">Evaluate in a sandbox; not GA.</text>

  <!-- Preview -->
  <rect x="594" y="90" width="266" height="340" rx="12" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="594" y="90" width="266" height="40" rx="12" fill="#78350f" opacity="0.5"/>
  <text x="727" y="116" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="800">Preview — watch</text>
  <g font-size="12.5" fill="#fef3c7" font-weight="600">
    <text x="616" y="162">Agent Identity</text>
    <text x="616" y="196">Cortex Sense</text>
    <text x="616" y="230">Datastream</text>
    <text x="616" y="264">Managed pg_lake</text>
    <text x="616" y="298">Open / Resharing</text>
  </g>
  <text x="616" y="406" fill="#fcd34d" font-size="11" font-style="italic">Not for production without review.</text>
</svg>
