<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="red1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg1)" rx="16"/>
  <text x="450" y="45" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Warehouse Right-Sizing: Before vs After</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Credit consumption comparison across warehouse sizes</text>

  <!-- Before section -->
  <text x="250" y="110" text-anchor="middle" fill="#ef4444" font-size="16" font-weight="600">BEFORE (Over-provisioned)</text>
  <!-- XL bars -->
  <rect x="80" y="135" width="340" height="50" rx="6" fill="url(#red1)" opacity="0.9"/>
  <text x="100" y="165" fill="#fff" font-size="13" font-weight="600">ETL Warehouse — X-Large</text>
  <text x="390" y="165" fill="#fff" font-size="13" font-weight="700" text-anchor="end">16 credits/hr</text>

  <rect x="80" y="195" width="340" height="50" rx="6" fill="url(#red1)" opacity="0.75"/>
  <text x="100" y="225" fill="#fff" font-size="13" font-weight="600">BI Warehouse — X-Large</text>
  <text x="390" y="225" fill="#fff" font-size="13" font-weight="700" text-anchor="end">16 credits/hr</text>

  <rect x="80" y="255" width="340" height="50" rx="6" fill="url(#red1)" opacity="0.6"/>
  <text x="100" y="285" fill="#fff" font-size="13" font-weight="600">Ad-hoc — Large</text>
  <text x="390" y="285" fill="#fff" font-size="13" font-weight="700" text-anchor="end">8 credits/hr</text>

  <rect x="80" y="320" width="340" height="35" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="250" y="343" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="700">Total: 40 credits/hr</text>

  <!-- Arrow -->
  <path d="M450 230 L470 230" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="470,222 485,230 470,238" fill="#94a3b8"/>

  <!-- After section -->
  <text x="680" y="110" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="600">AFTER (Right-sized)</text>

  <rect x="510" y="135" width="170" height="50" rx="6" fill="url(#green1)" opacity="0.9"/>
  <text x="525" y="158" fill="#fff" font-size="13" font-weight="600">ETL — Medium</text>
  <text x="665" y="158" fill="#fff" font-size="13" font-weight="700" text-anchor="end">4 cr/hr</text>
  <text x="525" y="175" fill="#d1fae5" font-size="11">Auto-suspend: 60s</text>

  <rect x="510" y="195" width="130" height="50" rx="6" fill="url(#green1)" opacity="0.75"/>
  <text x="525" y="218" fill="#fff" font-size="13" font-weight="600">BI — Small</text>
  <text x="625" y="218" fill="#fff" font-size="13" font-weight="700" text-anchor="end">2 cr/hr</text>
  <text x="525" y="235" fill="#d1fae5" font-size="11">Auto-suspend: 300s</text>

  <rect x="510" y="255" width="100" height="50" rx="6" fill="url(#green1)" opacity="0.6"/>
  <text x="525" y="278" fill="#fff" font-size="13" font-weight="600">Ad-hoc — XS</text>
  <text x="597" y="278" fill="#fff" font-size="13" font-weight="700" text-anchor="end">1 cr/hr</text>
  <text x="525" y="295" fill="#d1fae5" font-size="11">Auto-suspend: 60s</text>

  <rect x="510" y="320" width="340" height="35" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="680" y="343" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="700">Total: 7 credits/hr</text>

  <!-- Savings callout -->
  <rect x="250" y="390" width="400" height="80" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="420" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="600">PROJECTED SAVINGS</text>
  <text x="450" y="452" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">82.5% reduction in credit consumption</text>
</svg>
