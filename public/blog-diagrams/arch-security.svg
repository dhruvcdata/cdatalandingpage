<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg13)" rx="16"/>
  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Enterprise Security Architecture</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Layered security model for Snowflake</text>

  <!-- Layer 1: Network -->
  <rect x="60" y="85" width="780" height="80" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="115" fill="#fca5a5" font-size="16" font-weight="700">Network Security</text>
  <text x="120" y="140" fill="#94a3b8" font-size="12">IP allowlisting via Network Policies  |  AWS PrivateLink / Azure Private Link  |  No public internet access</text>

  <!-- Shield icon -->
  <rect x="760" y="100" width="55" height="50" rx="8" fill="#7f1d1d" opacity="0.4"/>
  <text x="787" y="132" text-anchor="middle" fill="#fca5a5" font-size="24">&#x1f6e1;</text>

  <!-- Layer 2: Authentication -->
  <rect x="100" y="180" width="700" height="80" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="210" fill="#fcd34d" font-size="16" font-weight="700">Authentication</text>
  <text x="160" y="235" fill="#94a3b8" font-size="12">MFA for all users  |  Key-pair auth for service accounts  |  SSO via SAML/OAuth  |  SCIM provisioning</text>

  <rect x="720" y="195" width="55" height="50" rx="8" fill="#78350f" opacity="0.4"/>
  <text x="747" y="227" text-anchor="middle" fill="#fcd34d" font-size="24">&#x1f511;</text>

  <!-- Layer 3: Authorization -->
  <rect x="140" y="275" width="620" height="80" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="305" fill="#60a5fa" font-size="16" font-weight="700">Authorization (RBAC)</text>
  <text x="200" y="330" fill="#94a3b8" font-size="12">Role hierarchy  |  Functional roles (ANALYST, ENGINEER)  |  Data roles (RAW_READ, ANALYTICS_RW)</text>

  <rect x="680" y="290" width="55" height="50" rx="8" fill="#1e3a5f" opacity="0.6"/>
  <text x="707" y="322" text-anchor="middle" fill="#60a5fa" font-size="24">&#x1f465;</text>

  <!-- Layer 4: Data Protection -->
  <rect x="180" y="370" width="540" height="90" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="240" y="400" fill="#4ade80" font-size="16" font-weight="700">Data Protection</text>
  <rect x="200" y="415" width="180" height="28" rx="6" fill="#14532d" opacity="0.5"/>
  <text x="290" y="434" text-anchor="middle" fill="#86efac" font-size="11">Dynamic Data Masking</text>
  <rect x="395" y="415" width="150" height="28" rx="6" fill="#14532d" opacity="0.5"/>
  <text x="470" y="434" text-anchor="middle" fill="#86efac" font-size="11">Row Access Policies</text>
  <rect x="560" y="415" width="140" height="28" rx="6" fill="#14532d" opacity="0.5"/>
  <text x="630" y="434" text-anchor="middle" fill="#86efac" font-size="11">External Tokenization</text>

  <rect x="640" y="385" width="55" height="50" rx="8" fill="#14532d" opacity="0.4"/>
  <text x="667" y="417" text-anchor="middle" fill="#4ade80" font-size="24">&#x1f512;</text>

  <!-- Center: Your Data label -->
  <rect x="350" y="375" width="20" height="5" fill="none"/>
</svg>
