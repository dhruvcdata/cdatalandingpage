<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1529"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a9fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d4f8a" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d6b5e" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="crumbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1a2744" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Divider line in center -->
  <line x1="400" y1="40" x2="400" y2="410" stroke="#1a2744" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- LEFT SIDE: Dashboard showing "success" -->
  <!-- Dashboard frame -->
  <rect x="60" y="60" width="280" height="200" rx="8" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Dashboard header bar -->
  <rect x="60" y="60" width="280" height="28" rx="8" fill="#142240"/>
  <rect x="60" y="76" width="280" height="12" fill="#142240"/>
  <circle cx="78" cy="74" r="4" fill="#dc2626" opacity="0.7"/>
  <circle cx="90" cy="74" r="4" fill="#f97316" opacity="0.7"/>
  <circle cx="102" cy="74" r="4" fill="#22c55e" opacity="0.7"/>

  <!-- Bar chart going UP -->
  <g filter="url(#glow)">
    <rect x="90" y="210" width="22" height="30" rx="2" fill="url(#glowTeal)" opacity="0.7"/>
    <rect x="120" y="185" width="22" height="55" rx="2" fill="url(#glowTeal)" opacity="0.8"/>
    <rect x="150" y="160" width="22" height="80" rx="2" fill="url(#glowBlue)" opacity="0.85"/>
    <rect x="180" y="140" width="22" height="100" rx="2" fill="url(#glowBlue)" opacity="0.9"/>
    <rect x="210" y="118" width="22" height="122" rx="2" fill="url(#glowBlue)"/>
  </g>

  <!-- Upward trend line on chart -->
  <polyline points="101,205 131,178 161,152 191,130 221,110" stroke="#14b8a6" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <circle cx="221" cy="110" r="4" fill="#14b8a6" filter="url(#glow)"/>

  <!-- Small line chart -->
  <rect x="252" y="98" width="78" height="50" rx="4" fill="#0a1220" stroke="#1e3a5f" stroke-width="0.8"/>
  <polyline points="260,138 272,128 284,130 296,118 308,110 320,105" stroke="#1a9fff" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Small KPI box -->
  <rect x="252" y="158" width="78" height="34" rx="4" fill="#0a1220" stroke="#1e3a5f" stroke-width="0.8"/>
  <rect x="262" y="168" width="40" height="6" rx="2" fill="#14b8a6" opacity="0.6"/>
  <rect x="262" y="178" width="55" height="4" rx="2" fill="#1e3a5f" opacity="0.5"/>

  <!-- Pie chart -->
  <rect x="252" y="200" width="78" height="50" rx="4" fill="#0a1220" stroke="#1e3a5f" stroke-width="0.8"/>
  <circle cx="280" cy="225" r="14" fill="none" stroke="#1a9fff" stroke-width="6" stroke-dasharray="60 28" opacity="0.7"/>
  <circle cx="280" cy="225" r="14" fill="none" stroke="#14b8a6" stroke-width="6" stroke-dasharray="22 66" stroke-dashoffset="-60" opacity="0.7"/>

  <!-- Big green up arrow -->
  <g transform="translate(200, 290)" filter="url(#softGlow)">
    <polygon points="0,-30 20,-30 20,-60 35,-60 0,-90 -35,-60 -20,-60 -20,-30" fill="#14b8a6" opacity="0.3"/>
    <polygon points="0,-25 15,-25 15,-55 28,-55 0,-80 -28,-55 -15,-55 -15,-25" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- RIGHT SIDE: Crumbling/failing reality -->
  <!-- Crumbling building blocks -->
  <g transform="translate(560, 130)">
    <!-- Main structure, tilting and breaking -->
    <g transform="rotate(3, 0, 100)">
      <!-- Foundation block cracking -->
      <rect x="-60" y="140" width="120" height="30" rx="3" fill="#1a1020" stroke="#7f1d1d" stroke-width="1" opacity="0.8"/>
      <line x1="-20" y1="140" x2="-10" y2="170" stroke="#dc2626" stroke-width="0.8" opacity="0.6"/>
      <line x1="30" y1="140" x2="40" y2="170" stroke="#dc2626" stroke-width="0.8" opacity="0.6"/>

      <!-- Middle blocks, separating -->
      <rect x="-55" y="105" width="50" height="30" rx="3" fill="#1a1525" stroke="#9a3412" stroke-width="1" opacity="0.7"/>
      <rect x="5" y="108" width="50" height="30" rx="3" fill="#1a1525" stroke="#9a3412" stroke-width="1" opacity="0.7" transform="rotate(2, 30, 120)"/>

      <!-- Top blocks, falling apart -->
      <rect x="-50" y="72" width="40" height="28" rx="3" fill="#1a1828" stroke="#b45309" stroke-width="1" opacity="0.6" transform="rotate(-4, -30, 86)"/>
      <rect x="15" y="68" width="40" height="28" rx="3" fill="#1a1828" stroke="#b45309" stroke-width="1" opacity="0.6" transform="rotate(6, 35, 82)"/>
    </g>

    <!-- Falling debris pieces -->
    <rect x="75" y="50" width="18" height="12" rx="2" fill="#1a1525" stroke="#7f1d1d" stroke-width="0.8" opacity="0.5" transform="rotate(25, 84, 56)"/>
    <rect x="85" y="90" width="14" height="10" rx="2" fill="#1a1525" stroke="#7f1d1d" stroke-width="0.8" opacity="0.4" transform="rotate(40, 92, 95)"/>
    <rect x="-90" y="80" width="16" height="11" rx="2" fill="#1a1525" stroke="#7f1d1d" stroke-width="0.8" opacity="0.4" transform="rotate(-20, -82, 85)"/>
    <rect x="-80" y="40" width="12" height="9" rx="2" fill="#1a1525" stroke="#7f1d1d" stroke-width="0.8" opacity="0.3" transform="rotate(-35, -74, 44)"/>

    <!-- Crack lines radiating -->
    <line x1="0" y1="170" x2="-30" y2="200" stroke="#dc2626" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="170" x2="25" y2="205" stroke="#dc2626" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="200" x2="-50" y2="210" stroke="#dc2626" stroke-width="0.8" opacity="0.2"/>
    <line x1="25" y1="205" x2="45" y2="215" stroke="#dc2626" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Big red/orange down arrow -->
  <g transform="translate(560, 370)" filter="url(#softGlow)">
    <polygon points="0,30 20,30 20,60 35,60 0,90 -35,60 -20,60 -20,30" fill="url(#dangerGrad)" opacity="0.3" transform="translate(0,-60)"/>
    <polygon points="0,25 15,25 15,55 28,55 0,80 -28,55 -15,55 -15,25" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6" transform="translate(0,-60)"/>
  </g>

  <!-- Declining revenue chart on right -->
  <rect x="440" y="310" width="100" height="70" rx="6" fill="#0f1020" stroke="#7f1d1d" stroke-width="1" opacity="0.6"/>
  <polyline points="452,330 466,332 480,338 494,350 508,360 522,370" stroke="#dc2626" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.8"/>

  <!-- Warning indicators on right side -->
  <g transform="translate(660, 320)" opacity="0.7">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="#0f1020" stroke="#7f1d1d" stroke-width="1"/>
    <!-- Warning triangle -->
    <polygon points="40,14 52,38 28,38" fill="none" stroke="#f97316" stroke-width="1.8" filter="url(#glow)"/>
    <line x1="40" y1="22" x2="40" y2="30" stroke="#f97316" stroke-width="2"/>
    <circle cx="40" cy="34" r="1.5" fill="#f97316"/>
    <rect x="14" y="44" width="52" height="4" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="14" y="51" width="36" height="3" rx="1.5" fill="#7f1d1d" opacity="0.3"/>
  </g>

  <!-- Connecting visual: data flowing from left to right, transforming -->
  <g opacity="0.4">
    <circle cx="370" cy="200" r="3" fill="#1a9fff"/>
    <circle cx="385" cy="190" r="2.5" fill="#1a9fff" opacity="0.8"/>
    <circle cx="398" cy="195" r="2" fill="#9a6030"/>
    <circle cx="412" cy="205" r="2.5" fill="#b45309" opacity="0.8"/>
    <circle cx="425" cy="210" r="3" fill="#dc2626" opacity="0.7"/>
  </g>

  <!-- Subtle vignette corners -->
  <rect width="800" height="450" fill="none" stroke="#000" stroke-width="80" stroke-opacity="0.2" rx="0"/>
</svg>