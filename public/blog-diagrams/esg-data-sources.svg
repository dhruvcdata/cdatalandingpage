<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bgE)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">ESG Data Sources in Commercial Real Estate</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">8 source systems feeding into a unified ESG data platform</text>

  <!-- Left column: Environmental sources -->
  <text x="160" y="90" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700" letter-spacing="1">ENVIRONMENTAL</text>

  <rect x="60" y="105" width="200" height="52" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="127" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Building Management Systems</text>
  <text x="160" y="145" text-anchor="middle" fill="#64748b" font-size="8">HVAC, lighting, elevator telemetry</text>

  <rect x="60" y="167" width="200" height="52" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="189" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Utility Billing Portals</text>
  <text x="160" y="207" text-anchor="middle" fill="#64748b" font-size="8">Electricity, gas, water, steam</text>

  <rect x="60" y="229" width="200" height="52" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="251" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">IoT Sensor Networks</text>
  <text x="160" y="269" text-anchor="middle" fill="#64748b" font-size="8">CO2, PM2.5, occupancy, sub-meters</text>

  <rect x="60" y="291" width="200" height="52" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="313" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Waste Management</text>
  <text x="160" y="331" text-anchor="middle" fill="#64748b" font-size="8">Hauler reports, diversion tracking</text>

  <!-- Right column: Social & Governance sources -->
  <text x="740" y="90" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700" letter-spacing="1">SOCIAL &amp; GOVERNANCE</text>

  <rect x="640" y="105" width="200" height="52" rx="6" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="127" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Tenant Engagement</text>
  <text x="740" y="145" text-anchor="middle" fill="#64748b" font-size="8">Surveys, commute data, green leases</text>

  <rect x="640" y="167" width="200" height="52" rx="6" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="189" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Property Management</text>
  <text x="740" y="207" text-anchor="middle" fill="#64748b" font-size="8">Yardi, MRI — sqft, occupancy, leases</text>

  <rect x="640" y="229" width="200" height="52" rx="6" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="251" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Health Certifications</text>
  <text x="740" y="269" text-anchor="middle" fill="#64748b" font-size="8">WELL, Fitwel, accessibility status</text>

  <rect x="640" y="291" width="200" height="52" rx="6" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="313" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Governance Records</text>
  <text x="740" y="331" text-anchor="middle" fill="#64748b" font-size="8">ESG policies, board reviews, supply chain</text>

  <!-- Arrows into central platform -->
  <line x1="260" y1="131" x2="350" y2="420" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="260" y1="193" x2="350" y2="420" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="260" y1="255" x2="350" y2="420" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="260" y1="317" x2="350" y2="420" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="640" y1="131" x2="550" y2="420" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="640" y1="193" x2="550" y2="420" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="640" y1="255" x2="550" y2="420" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="640" y1="317" x2="550" y2="420" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Central ESG Data Platform -->
  <rect x="300" y="390" width="300" height="60" rx="10" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="416" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">ESG Data Platform</text>
  <text x="450" y="436" text-anchor="middle" fill="#93c5fd" font-size="10">Bronze → Silver → Gold</text>

  <!-- Output arrows -->
  <line x1="370" y1="450" x2="170" y2="500" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="450" y1="450" x2="450" y2="500" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="530" y1="450" x2="730" y2="500" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Certification outputs -->
  <rect x="80" y="500" width="170" height="48" rx="6" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="165" y="520" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">GRESB</text>
  <text x="165" y="536" text-anchor="middle" fill="#64748b" font-size="8">Investor benchmark (0–100)</text>

  <rect x="365" y="500" width="170" height="48" rx="6" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="520" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">LEED / Arc</text>
  <text x="450" y="536" text-anchor="middle" fill="#64748b" font-size="8">Green building certification</text>

  <rect x="650" y="500" width="170" height="48" rx="6" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="735" y="520" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">ENERGY STAR</text>
  <text x="735" y="536" text-anchor="middle" fill="#64748b" font-size="8">EPA/NRCan benchmarking</text>

  <!-- Footer -->
  <text x="450" y="585" text-anchor="middle" fill="#475569" font-size="10">cdatainsights.com — CData Consulting Inc</text>
</svg>