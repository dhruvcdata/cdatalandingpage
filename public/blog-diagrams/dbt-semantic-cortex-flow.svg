<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrDown" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0,0 6,0 3,8" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)" rx="16"/>
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">From dbt Models to Conversational Analytics</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">dbt Semantic Layer + Snowflake Cortex Analyst — one definition, every consumer</text>

  <rect x="60" y="90" width="780" height="80" rx="10" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
  <text x="80" y="115" fill="#4ade80" font-size="13" font-weight="700">1. dbt Models in Snowflake</text>

  <rect x="80" y="125" width="220" height="35" rx="6" fill="#7f1d1d" opacity="0.5"/>
  <text x="190" y="148" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Bronze · raw_orders, raw_users</text>

  <rect x="320" y="125" width="220" height="35" rx="6" fill="#78350f" opacity="0.5"/>
  <text x="430" y="148" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Silver · stg_orders, stg_users</text>

  <rect x="560" y="125" width="220" height="35" rx="6" fill="#14532d" opacity="0.5"/>
  <text x="670" y="148" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">Gold · fct_orders, dim_users</text>

  <line x1="450" y1="170" x2="450" y2="200" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrDown)"/>

  <rect x="60" y="200" width="780" height="100" rx="10" fill="#0b1220" stroke="#a855f7" stroke-width="1.5"/>
  <text x="80" y="225" fill="#c084fc" font-size="13" font-weight="700">2. dbt Semantic Layer (MetricFlow)</text>
  <text x="80" y="245" fill="#94a3b8" font-size="11">One definition per business concept · governed · queryable across tools</text>

  <rect x="80" y="255" width="240" height="35" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="200" y="278" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Metrics: MRR, ARPU, Churn</text>

  <rect x="335" y="255" width="240" height="35" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="455" y="278" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Dimensions: plan, region, cohort</text>

  <rect x="590" y="255" width="240" height="35" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="710" y="278" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Entities: customer, subscription</text>

  <line x1="450" y1="300" x2="450" y2="330" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrDown)"/>

  <rect x="60" y="330" width="780" height="80" rx="10" fill="#0b1220" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="80" y="355" fill="#22d3ee" font-size="13" font-weight="700">3. Snowflake Cortex Analyst</text>
  <text x="80" y="372" fill="#94a3b8" font-size="11">Natural language → governed SQL via the semantic layer · no hallucinated joins</text>

  <rect x="80" y="380" width="240" height="22" rx="5" fill="#0c4a6e" opacity="0.5"/>
  <text x="200" y="396" text-anchor="middle" fill="#22d3ee" font-size="10" font-style="italic">"What was MRR last quarter by plan?"</text>

  <text x="335" y="396" fill="#60a5fa" font-size="14">→</text>

  <rect x="360" y="380" width="200" height="22" rx="5" fill="#0c4a6e" opacity="0.5"/>
  <text x="460" y="396" text-anchor="middle" fill="#22d3ee" font-size="10" font-family="Menlo, monospace">resolves to MRR metric</text>

  <text x="575" y="396" fill="#60a5fa" font-size="14">→</text>

  <rect x="600" y="380" width="220" height="22" rx="5" fill="#0c4a6e" opacity="0.5"/>
  <text x="710" y="396" text-anchor="middle" fill="#22d3ee" font-size="10" font-family="Menlo, monospace">SELECT ... GROUP BY plan</text>

  <line x1="450" y1="410" x2="450" y2="440" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrDown)"/>

  <text x="450" y="463" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">4. Consumers · same metric, every surface</text>

  <rect x="60" y="475" width="180" height="35" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="150" y="498" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Slack bot</text>

  <rect x="260" y="475" width="180" height="35" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="350" y="498" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Tableau · Looker · Hex</text>

  <rect x="460" y="475" width="180" height="35" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="550" y="498" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">AI app · Streamlit</text>

  <rect x="660" y="475" width="180" height="35" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="750" y="498" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Reverse ETL · Hightouch</text>
</svg>
