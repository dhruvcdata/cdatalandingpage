<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="ssbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="50%" stop-color="#0f1d3d"/>
      <stop offset="100%" stop-color="#0a1430"/>
    </linearGradient>
    <radialGradient id="ssglow" cx="72%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ssglow2" cx="20%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <g id="flake" stroke-linecap="round">
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-43" y1="-25" x2="43" y2="25"/>
      <line x1="-43" y1="25" x2="43" y2="-25"/>
      <g stroke-width="0.7">
        <line x1="0" y1="-50" x2="-12" y2="-38"/><line x1="0" y1="-50" x2="12" y2="-38"/>
        <line x1="0" y1="50" x2="-12" y2="38"/><line x1="0" y1="50" x2="12" y2="38"/>
        <line x1="-43" y1="-25" x2="-30" y2="-28"/><line x1="-43" y1="-25" x2="-42" y2="-9"/>
        <line x1="43" y1="25" x2="30" y2="28"/><line x1="43" y1="25" x2="42" y2="9"/>
        <line x1="-43" y1="25" x2="-30" y2="28"/><line x1="-43" y1="25" x2="-42" y2="9"/>
        <line x1="43" y1="-25" x2="30" y2="-28"/><line x1="43" y1="-25" x2="42" y2="-9"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="600" fill="url(#ssbg)"/>
  <rect width="1600" height="600" fill="url(#ssglow)"/>
  <rect width="1600" height="600" fill="url(#ssglow2)"/>

  <!-- faint dotted grid texture -->
  <g fill="#1e3a8a" opacity="0.18">
    <!-- generated dot field, sparse -->
    <circle cx="120" cy="80" r="2"/><circle cx="220" cy="140" r="2"/><circle cx="80" cy="220" r="2"/>
    <circle cx="300" cy="60" r="2"/><circle cx="380" cy="200" r="2"/><circle cx="180" cy="320" r="2"/>
    <circle cx="1500" cy="120" r="2"/><circle cx="1420" cy="220" r="2"/><circle cx="1540" cy="300" r="2"/>
    <circle cx="1340" cy="80" r="2"/><circle cx="1280" cy="180" r="2"/><circle cx="1460" cy="420" r="2"/>
    <circle cx="60" cy="460" r="2"/><circle cx="240" cy="500" r="2"/><circle cx="1380" cy="520" r="2"/>
  </g>

  <!-- large faint snowflakes scattered -->
  <use href="#flake" x="1300" y="150" stroke="#38bdf8" stroke-width="2" opacity="0.20" transform="scale(2.4) translate(-760,-30)"/>
  <use href="#flake" x="240" y="430" stroke="#60a5fa" stroke-width="2" opacity="0.16" transform="scale(1.6)"/>
  <use href="#flake" x="1480" y="470" stroke="#7dd3fc" stroke-width="2" opacity="0.14"/>
  <use href="#flake" x="120" y="120" stroke="#7dd3fc" stroke-width="2" opacity="0.12"/>
  <use href="#flake" x="820" y="90" stroke="#38bdf8" stroke-width="2" opacity="0.10"/>

  <!-- crisp focal snowflake, upper-right safe zone -->
  <use href="#flake" x="1180" y="200" stroke="#7dd3fc" stroke-width="2.4" opacity="0.55"/>
</svg>
