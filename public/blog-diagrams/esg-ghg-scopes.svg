<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bgG)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">GHG Emissions Scoping for Real Estate</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Scope 1, 2, and 3 — data sources, complexity, and confidence levels</text>

  <!-- Scope 1 -->
  <rect x="40" y="80" width="260" height="310" rx="8" fill="rgba(16,185,129,0.06)" stroke="#10b981" stroke-width="1.5"/>
  <text x="170" y="108" text-anchor="middle" fill="#10b981" font-size="15" font-weight="700">Scope 1</text>
  <text x="170" y="125" text-anchor="middle" fill="#34d399" font-size="10">Direct Emissions</text>

  <rect x="60" y="142" width="220" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="170" y="162" text-anchor="middle" fill="#e5e7eb" font-size="9">Natural Gas Boilers</text>

  <rect x="60" y="180" width="220" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="170" y="200" text-anchor="middle" fill="#e5e7eb" font-size="9">Diesel Generators</text>

  <rect x="60" y="218" width="220" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="170" y="238" text-anchor="middle" fill="#e5e7eb" font-size="9">Refrigerant Leaks</text>

  <text x="170" y="275" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">Data Source</text>
  <text x="170" y="292" text-anchor="middle" fill="#64748b" font-size="8">Gas meters, equipment logs</text>

  <rect x="80" y="310" width="180" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="170" y="329" text-anchor="middle" fill="#34d399" font-size="9" font-weight="600">Confidence: HIGH</text>

  <text x="170" y="365" text-anchor="middle" fill="#64748b" font-size="8">Metered, owner-controlled</text>
  <text x="170" y="378" text-anchor="middle" fill="#64748b" font-size="8">Straightforward calculation</text>

  <!-- Scope 2 -->
  <rect x="320" y="80" width="260" height="310" rx="8" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="108" text-anchor="middle" fill="#3b82f6" font-size="15" font-weight="700">Scope 2</text>
  <text x="450" y="125" text-anchor="middle" fill="#93c5fd" font-size="10">Indirect — Purchased Energy</text>

  <rect x="340" y="142" width="220" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="450" y="162" text-anchor="middle" fill="#e5e7eb" font-size="9">Purchased Electricity</text>

  <rect x="340" y="180" width="220" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="450" y="200" text-anchor="middle" fill="#e5e7eb" font-size="9">Purchased Steam</text>

  <rect x="340" y="218" width="220" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="450" y="238" text-anchor="middle" fill="#e5e7eb" font-size="9">District Chilled Water</text>

  <text x="450" y="275" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">Data Source</text>
  <text x="450" y="292" text-anchor="middle" fill="#64748b" font-size="8">Utility bills + grid emission factors</text>

  <rect x="360" y="310" width="180" height="28" rx="14" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="450" y="329" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">Confidence: HIGH</text>

  <text x="450" y="365" text-anchor="middle" fill="#64748b" font-size="8">eGRID subregion (US)</text>
  <text x="450" y="378" text-anchor="middle" fill="#64748b" font-size="8">NIR factors (Canada)</text>

  <!-- Scope 3 -->
  <rect x="600" y="80" width="260" height="310" rx="8" fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="108" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="700">Scope 3</text>
  <text x="730" y="125" text-anchor="middle" fill="#fbbf24" font-size="10">Value Chain Emissions</text>

  <rect x="620" y="142" width="220" height="30" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="730" y="162" text-anchor="middle" fill="#e5e7eb" font-size="9">Tenant Energy (Net Lease)</text>

  <rect x="620" y="180" width="220" height="30" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="730" y="200" text-anchor="middle" fill="#e5e7eb" font-size="9">Embodied Carbon (Materials)</text>

  <rect x="620" y="218" width="220" height="30" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="730" y="238" text-anchor="middle" fill="#e5e7eb" font-size="9">Commuting + Waste Disposal</text>

  <text x="730" y="275" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">Data Source</text>
  <text x="730" y="292" text-anchor="middle" fill="#64748b" font-size="8">Tenant bills, surveys, LCA databases</text>

  <rect x="640" y="310" width="180" height="28" rx="14" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="730" y="329" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Confidence: LOW–MEDIUM</text>

  <text x="730" y="365" text-anchor="middle" fill="#64748b" font-size="8">Owner does not control data</text>
  <text x="730" y="378" text-anchor="middle" fill="#64748b" font-size="8">Requires green lease clauses</text>

  <!-- Complexity arrow -->
  <line x1="80" y1="420" x2="820" y2="420" stroke="#475569" stroke-width="1.5"/>
  <polygon points="820,415 830,420 820,425" fill="#475569"/>
  <text x="80" y="440" fill="#10b981" font-size="9" font-weight="600">Simple</text>
  <text x="450" y="440" text-anchor="middle" fill="#94a3b8" font-size="9">Data Engineering Complexity</text>
  <text x="820" y="440" text-anchor="end" fill="#f59e0b" font-size="9" font-weight="600">Complex</text>

  <!-- Footer -->
  <text x="450" y="472" text-anchor="middle" fill="#475569" font-size="10">cdatainsights.com — CData Consulting Inc</text>
</svg>