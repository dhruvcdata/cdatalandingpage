<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111128;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="700">The Hybrid Delivery Model</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="15">How consultancies scale data engineering without overbuilding</text>

  <!-- Divider line -->
  <line x1="100" y1="95" x2="1100" y2="95" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT: Core Team Box -->
  <rect x="60" y="120" width="340" height="440" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="60" y="120" width="340" height="48" rx="12" fill="url(#accent1)" opacity="0.15"/>
  <rect x="60" y="156" width="340" height="1" fill="url(#accent1)" opacity="0.3"/>
  <circle cx="90" cy="144" r="10" fill="url(#accent1)" opacity="0.8"/>
  <text x="90" y="149" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">C</text>
  <text x="115" y="150" fill="#93c5fd" font-size="16" font-weight="700">Core Team (In-House)</text>

  <!-- Core roles -->
  <text x="90" y="195" fill="#cbd5e1" font-size="14" font-weight="600">Data Leads &amp; Architects</text>
  <text x="90" y="215" fill="#64748b" font-size="12">Own client relationships &amp; technical strategy</text>

  <line x1="80" y1="232" x2="380" y2="232" stroke="#1e293b" stroke-width="0.5"/>

  <text x="90" y="258" fill="#cbd5e1" font-size="14" font-weight="600">Data Product Managers</text>
  <text x="90" y="278" fill="#64748b" font-size="12">Translate business requirements into specs</text>

  <line x1="80" y1="295" x2="380" y2="295" stroke="#1e293b" stroke-width="0.5"/>

  <text x="90" y="321" fill="#cbd5e1" font-size="14" font-weight="600">Senior Engineers</text>
  <text x="90" y="341" fill="#64748b" font-size="12">Deep expertise in primary tech stack</text>

  <line x1="80" y1="365" x2="380" y2="365" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Core stats -->
  <rect x="85" y="385" width="290" height="65" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="230" y="408" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">HANDLES</text>
  <text x="230" y="435" text-anchor="middle" fill="#e2e8f0" font-size="14">Discovery | Architecture | Client Mgmt</text>

  <!-- Capacity bar -->
  <text x="90" y="480" fill="#94a3b8" font-size="11">TEAM UTILIZATION</text>
  <rect x="90" y="490" width="280" height="8" rx="4" fill="#1e293b"/>
  <rect x="90" y="490" width="252" height="8" rx="4" fill="url(#accent1)" opacity="0.8"/>
  <text x="375" y="499" fill="#93c5fd" font-size="11" text-anchor="end">90%</text>

  <text x="90" y="530" fill="#94a3b8" font-size="11">FIXED COST</text>
  <rect x="90" y="540" width="280" height="8" rx="4" fill="#1e293b"/>
  <rect x="90" y="540" width="224" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
  <text x="375" y="549" fill="#fbbf24" font-size="11" text-anchor="end">80%</text>

  <!-- MIDDLE: Connection arrows -->
  <!-- Arrow from Core to Client -->
  <path d="M 430 290 L 470 290" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" filter="url(#glow)"/>
  <path d="M 470 290 L 470 200 L 510 200" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <path d="M 470 290 L 470 380 L 510 380" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="6,4"/>

  <!-- CENTER: Client circle -->
  <circle cx="600" cy="290" r="62" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
  <circle cx="600" cy="290" r="62" fill="#6366f1" opacity="0.08"/>
  <text x="600" y="280" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">ENTERPRISE</text>
  <text x="600" y="300" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">CLIENT</text>
  <text x="600" y="323" text-anchor="middle" fill="#818cf8" font-size="11">Sees one team</text>

  <!-- Lines from center to sides -->
  <line x1="538" y1="270" x2="400" y2="270" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="538" y1="310" x2="400" y2="310" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="662" y1="270" x2="800" y2="270" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  <line x1="662" y1="310" x2="800" y2="310" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>

  <!-- RIGHT: Flex Capacity Box -->
  <rect x="800" y="120" width="340" height="440" rx="12" fill="#0f172a" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="800" y="120" width="340" height="48" rx="12" fill="url(#accent2)" opacity="0.15"/>
  <rect x="800" y="156" width="340" height="1" fill="url(#accent2)" opacity="0.3"/>
  <circle cx="830" cy="144" r="10" fill="url(#accent2)" opacity="0.8"/>
  <text x="830" y="149" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">P</text>
  <text x="855" y="150" fill="#6ee7b7" font-size="16" font-weight="700">Flex Capacity (Partners)</text>

  <!-- Partner roles -->
  <text x="830" y="195" fill="#cbd5e1" font-size="14" font-weight="600">Data Engineers</text>
  <text x="830" y="215" fill="#64748b" font-size="12">Plug into engagements within days</text>

  <line x1="820" y1="232" x2="1120" y2="232" stroke="#1e293b" stroke-width="0.5"/>

  <text x="830" y="258" fill="#cbd5e1" font-size="14" font-weight="600">Migration Specialists</text>
  <text x="830" y="278" fill="#64748b" font-size="12">Redshift-to-Snowflake, on-prem-to-cloud</text>

  <line x1="820" y1="295" x2="1120" y2="295" stroke="#1e293b" stroke-width="0.5"/>

  <text x="830" y="321" fill="#cbd5e1" font-size="14" font-weight="600">Platform Engineers</text>
  <text x="830" y="341" fill="#64748b" font-size="12">Rapid infrastructure builds &amp; delivery</text>

  <line x1="820" y1="365" x2="1120" y2="365" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Partner stats -->
  <rect x="825" y="385" width="290" height="65" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="970" y="408" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">HANDLES</text>
  <text x="970" y="435" text-anchor="middle" fill="#e2e8f0" font-size="14">Engineering Lift | Migrations | Builds</text>

  <!-- Capacity bar -->
  <text x="830" y="480" fill="#94a3b8" font-size="11">SCALE FLEXIBILITY</text>
  <rect x="830" y="490" width="280" height="8" rx="4" fill="#1e293b"/>
  <rect x="830" y="490" width="266" height="8" rx="4" fill="url(#accent2)" opacity="0.8"/>
  <text x="1115" y="499" fill="#6ee7b7" font-size="11" text-anchor="end">95%</text>

  <text x="830" y="530" fill="#94a3b8" font-size="11">FIXED COST</text>
  <rect x="830" y="540" width="280" height="8" rx="4" fill="#1e293b"/>
  <rect x="830" y="540" width="56" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
  <text x="1115" y="549" fill="#fbbf24" font-size="11" text-anchor="end">20%</text>

  <!-- Bottom bar: The Math -->
  <rect x="60" y="585" width="1080" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <text x="130" y="615" fill="#fbbf24" font-size="15" font-weight="700">THE MATH:</text>
  <text x="255" y="615" fill="#e2e8f0" font-size="15">10-person core + 2-3 partners</text>
  <text x="530" y="615" fill="#94a3b8" font-size="15">=</text>
  <text x="560" y="615" fill="#6ee7b7" font-size="15" font-weight="700">capacity of a 20-person team</text>

  <text x="255" y="643" fill="#94a3b8" font-size="13">Lower fixed costs | Faster ramp | Scale up or down per engagement</text>
</svg>
